<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="DejaVu Sans, Arial, sans-serif">
  <!-- Escala: 1 m = 50 px. Mundo x ∈ [0, 12] m, y ∈ [-6, 6] m. px = 80 + 50x ; py = 60 + 50(6 - y) -->
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#c9a77a" stroke-width="0.6"/>
    </pattern>
    <pattern id="sand" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#a8743a"/><circle cx="6" cy="6" r="1.1" fill="#a8743a"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d2b3a"/>
    </marker>
    <marker id="route" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="1000" height="760" fill="#f5f3ee"/>

  <!-- Suelo marciano + rejilla de 1 m -->
  <rect x="80" y="60" width="600" height="600" fill="#e2b984"/>
  <rect x="80" y="60" width="600" height="600" fill="url(#grid)"/>

  <!-- Arena suelta (baja fricción) -->
  <rect x="380" y="550" width="100" height="70" fill="url(#sand)" stroke="#a8743a" stroke-dasharray="4 3"/>
  <text x="430" y="640" font-size="11" text-anchor="middle" fill="#6b4520">arena: v ×0.5</text>

  <!-- Grieta / hoyo (falla) -->
  <ellipse cx="255" cy="185" rx="25" ry="10" fill="#2a1a10"/>
  <text x="255" y="212" font-size="11" text-anchor="middle" fill="#2a1a10">grieta</text>

  <!-- Base -->
  <rect x="105" y="310" width="100" height="100" fill="#2e9a49" stroke="#6cc47f" stroke-width="4"/>
  <text x="155" y="430" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f6b33">BASE</text>

  <!-- Rocas fijas -->
  <g fill="#8d8d93" stroke="#4a4a50" stroke-width="1.5">
    <rect x="305" y="245" width="50" height="80"/>
    <rect x="300" y="460" width="60" height="50"/>
    <rect x="460" y="310" width="40" height="100"/>
    <rect x="205" y="560" width="50" height="50"/>
    <rect x="585" y="90" width="40" height="40"/>
  </g>
  <g font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">
    <text x="330" y="289">R1</text><text x="330" y="489">R2</text>
    <text x="480" y="364">R3</text><text x="230" y="589">R4</text><text x="605" y="114">R5</text>
  </g>

  <!-- Perturbación: corredor bloqueado (aparece al visitar B1) -->
  <rect x="510" y="345" width="110" height="30" fill="#d9462f" fill-opacity="0.35" stroke="#d9462f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="565" y="338" font-size="11" text-anchor="middle" fill="#a3301d" font-weight="bold">bloqueo</text>
  <!-- Ancho de pasillo mínimo -->
  <line x1="620" y1="360" x2="676" y2="360" stroke="#1d2b3a" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="631" y="367" width="38" height="15" fill="#e2b984"/><text x="650" y="379" font-size="11" text-anchor="middle" fill="#1d2b3a">1.2 m</text>

  <!-- Ruta de referencia (base → B1 → B2 → base) -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="8 6">
    <polyline points="155,360 380,360 540,200" marker-end="url(#route)"/>
    <polyline points="555,215 555,330" marker-end="url(#route)"/>
    <polyline points="555,390 555,505" marker-end="url(#route)"/>
    <polyline points="530,525 210,385" marker-end="url(#route)"/>
  </g>
  <!-- Ruta alternativa si hay bloqueo -->
  <polyline points="570,210 650,330 650,390 572,512" fill="none" stroke="#a3301d" stroke-width="2" stroke-dasharray="3 4"/>

  <!-- Balizas con radio de visita 0.6 m -->
  <g>
    <circle cx="555" cy="185" r="30" fill="#25d0e8" fill-opacity="0.18" stroke="#0b8ea3" stroke-dasharray="4 3"/>
    <rect x="543" y="173" width="24" height="24" fill="#25d0e8" stroke="#0b6e7f" stroke-width="2"/>
    <text x="555" y="191" font-size="15" font-weight="bold" text-anchor="middle" fill="#0d2230">1</text>
    <text x="555" y="152" font-size="11" text-anchor="middle" fill="#0d2230">B1 (9.5, 3.5)</text>

    <circle cx="555" cy="535" r="30" fill="#25d0e8" fill-opacity="0.18" stroke="#0b8ea3" stroke-dasharray="4 3"/>
    <rect x="543" y="523" width="24" height="24" fill="#25d0e8" stroke="#0b6e7f" stroke-width="2"/>
    <text x="555" y="541" font-size="15" font-weight="bold" text-anchor="middle" fill="#0d2230">2</text>
    <text x="555" y="582" font-size="11" text-anchor="middle" fill="#0d2230">B2 (9.5, -3.5)</text>
  </g>

  <!-- Rayos de distancia (9, de -90° a +90°, dibujados a 2 m de 5 m de alcance) -->
  <g stroke="#0b8ea3" stroke-width="1.3">
    <line x1="155" y1="360" x2="155" y2="260"/><line x1="155" y1="360" x2="193.3" y2="267.6"/>
    <line x1="155" y1="360" x2="225.7" y2="289.3"/><line x1="155" y1="360" x2="247.4" y2="321.7"/>
    <line x1="155" y1="360" x2="255" y2="360"/><line x1="155" y1="360" x2="247.4" y2="398.3"/>
    <line x1="155" y1="360" x2="225.7" y2="430.7"/><line x1="155" y1="360" x2="193.3" y2="452.4"/>
    <line x1="155" y1="360" x2="155" y2="460"/>
  </g>

  <!-- Robot en la posición inicial (1.5, 0), mirando a +x -->
  <circle cx="155" cy="360" r="11" fill="#f3efe6" stroke="#1d2b3a" stroke-width="2"/>
  <line x1="155" y1="360" x2="172" y2="360" stroke="#1d2b3a" stroke-width="3"/>
  <text x="155" y="447" font-size="11" text-anchor="middle" fill="#0d2230" font-weight="bold">INICIO (1.5, 0)</text>

  <!-- Paredes -->
  <rect x="80" y="60" width="600" height="600" fill="none" stroke="#5c5c63" stroke-width="8"/>

  <!-- Cotas -->
  <line x1="80" y1="35" x2="680" y2="35" stroke="#1d2b3a" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="380" y="28" font-size="13" text-anchor="middle" fill="#1d2b3a">12 m (pared 0.5 m de alto)</text>
  <line x1="45" y1="60" x2="45" y2="660" stroke="#1d2b3a" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="32" y="360" font-size="13" text-anchor="middle" fill="#1d2b3a" transform="rotate(-90 32 360)">12 m</text>

  <!-- Marcas de ejes -->
  <g font-size="10" fill="#4a4a50" text-anchor="middle">
    <text x="80" y="678">0</text><text x="180" y="678">2</text><text x="280" y="678">4</text>
    <text x="380" y="678">6</text><text x="480" y="678">8</text><text x="580" y="678">10</text><text x="680" y="678">12</text>
    <text x="380" y="696">x (m)</text>
  </g>
  <g font-size="10" fill="#4a4a50" text-anchor="end">
    <text x="72" y="64">6</text><text x="72" y="164">4</text><text x="72" y="264">2</text><text x="72" y="364">0</text>
    <text x="72" y="464">-2</text><text x="72" y="564">-4</text><text x="72" y="664">-6</text>
  </g>
  <g stroke="#1d2b3a" stroke-width="2">
    <line x1="100" y1="730" x2="150" y2="730" marker-end="url(#arrow)"/>
    <line x1="100" y1="730" x2="100" y2="705" marker-end="url(#arrow)"/>
  </g>
  <text x="156" y="734" font-size="11" fill="#1d2b3a">x</text>
  <text x="96" y="702" font-size="11" fill="#1d2b3a" text-anchor="end">y</text>
  <line x1="200" y1="728" x2="250" y2="728" stroke="#1d2b3a" stroke-width="3"/>
  <text x="225" y="745" font-size="10" text-anchor="middle" fill="#1d2b3a">1 m</text>

  <!-- Leyenda -->
  <g font-size="12" fill="#1d2b3a">
    <text x="715" y="80" font-size="18" font-weight="bold">Robot Expedition</text>
    <text x="715" y="100" font-size="12">Mapa v0.1 · vista superior</text>
    <text x="715" y="118" font-size="11" fill="#4a4a50">Gravedad de Marte 3.71 m/s²</text>

    <rect x="715" y="145" width="22" height="22" fill="#2e9a49" stroke="#6cc47f" stroke-width="3"/>
    <text x="747" y="161">Base 2×2 m (inicio y fin)</text>
    <rect x="718" y="182" width="16" height="16" fill="#25d0e8" stroke="#0b6e7f" stroke-width="2"/>
    <text x="747" y="195">Baliza, radio de visita 0.6 m</text>
    <rect x="715" y="215" width="22" height="18" fill="#8d8d93" stroke="#4a4a50"/>
    <text x="747" y="229">Roca (choque físico)</text>
    <ellipse cx="726" cy="256" rx="11" ry="5" fill="#2a1a10"/>
    <text x="747" y="261">Grieta: caer = falla</text>
    <rect x="715" y="280" width="22" height="16" fill="url(#sand)" stroke="#a8743a" stroke-dasharray="3 2"/>
    <text x="747" y="293">Arena (velocidad ×0.5)</text>
    <rect x="715" y="312" width="22" height="14" fill="#d9462f" fill-opacity="0.35" stroke="#d9462f" stroke-dasharray="4 3"/>
    <text x="747" y="324">Perturbación: bloqueo</text>
    <line x1="715" y1="348" x2="737" y2="348" stroke="#555" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="747" y="352">Ruta de referencia ≈ 25 m</text>
    <line x1="715" y1="378" x2="737" y2="378" stroke="#a3301d" stroke-width="2" stroke-dasharray="3 4"/>
    <text x="747" y="382">Ruta alterna con bloqueo</text>
    <line x1="715" y1="408" x2="737" y2="400" stroke="#0b8ea3" stroke-width="1.5"/>
    <line x1="715" y1="408" x2="737" y2="408" stroke="#0b8ea3" stroke-width="1.5"/>
    <line x1="715" y1="408" x2="737" y2="416" stroke="#0b8ea3" stroke-width="1.5"/>
    <text x="747" y="412">9 rayos, alcance 5 m</text>

    <text x="715" y="455" font-weight="bold">Orden de la misión</text>
    <text x="715" y="475">1. Base → B1</text>
    <text x="715" y="493">2. B1 → B2</text>
    <text x="715" y="511">3. B2 → Base</text>

    <text x="715" y="550" font-weight="bold">Notas</text>
    <text x="715" y="570" font-size="11">Rocas R1–R5: diseño de referencia.</text>
    <text x="715" y="586" font-size="11">Con --jitter se mueven hasta</text>
    <text x="715" y="602" font-size="11">±0.5 m; un BFS asegura la ruta.</text>
    <text x="715" y="622" font-size="11">El bloqueo aparece al visitar B1</text>
    <text x="715" y="638" font-size="11">solo en evaluación (--perturbation).</text>
  </g>
</svg>
