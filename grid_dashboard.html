<!doctype html><meta charset="utf-8"><title>Robot marciano Q-learning</title><style>body{background:#100d12;color:#eee;font:18px system-ui;max-width:920px;margin:25px auto;padding:0 15px}h1{color:#e79a58}.stats{display:flex;gap:25px;flex-wrap:wrap;margin:12px 0;color:#f1b26b}.stats b{color:#fff}canvas{width:100%;background:#201720;border:2px solid #714332;image-rendering:pixelated}</style><h1>Robot marciano aprendiendo</h1><div class="stats">Época <b id="e">—</b> Premio <b id="r">—</b> Pasos <b id="s">—</b> Estado <b id="st">—</b></div><canvas id="c" width="900" height="500"></canvas><script>const C=document.querySelector('#c'),g=C.getContext('2d');let d=null,n=0,lastEpisode=null;async function load(){try{const next=await(await fetch('logs/qlearning_live.json?'+Date.now())).json();if(lastEpisode!==next.episode){n=0;lastEpisode=next.episode}d=next;e.textContent=d.episode+'/'+d.total_episodes;r.textContent=Number(d.reward).toFixed(1);s.textContent=d.steps;st.textContent=d.status}catch(x){}}function draw(){const cell=48,ox=150,oy=55,p=d?.path||[[1,6]],pos=p[Math.min(n,p.length-1)]||p[p.length-1];g.fillStyle='#171c2b';g.fillRect(0,0,900,500);g.fillStyle='#8b4934';g.fillRect(0,365,900,135);for(let i=0;i<18;i++){g.fillStyle=i%2?'#b56743':'#6e3c36';g.beginPath();g.arc((i*83+25)%900,390+(i%3)*30,10+i%7,0,7);g.fill()}g.fillStyle='#5e6870';for(let x=0;x<12;x++)for(let y=0;y<8;y++)g.fillRect(ox+x*cell,oy+y*cell,cell-3,cell-3);for(let y=1;y<6;y++){g.fillStyle='#7b3e35';g.fillRect(ox+4*cell,oy+y*cell,cell-3,cell-3)}for(let y=2;y<7;y++){g.fillStyle='#7b3e35';g.fillRect(ox+7*cell,oy+y*cell,cell-3,cell-3)}g.strokeStyle='#f2a65a';g.lineWidth=4;g.beginPath();p.slice(0,n+1).forEach((v,i)=>{const x=ox+v[0]*cell+24,y=oy+v[1]*cell+24;i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();g.fillStyle='#e8c16a';g.fillRect(ox+d.goal_x*cell+8,oy+d.goal_y*cell+8,cell-18,cell-18);const rx=ox+pos[0]*cell+6,ry=oy+pos[1]*cell+6;g.fillStyle='#dba23e';g.fillRect(rx,ry,36,36);g.fillStyle='#253c50';g.fillRect(rx+6,ry+7,24,13);g.fillStyle='#b9f5ef';g.fillRect(rx+10,ry+10,5,5);g.fillRect(rx+20,ry+10,5,5);g.fillStyle='#dba23e';g.fillRect(rx+16,ry-10,4,10);g.fillStyle='#e67546';g.fillRect(rx+14,ry-15,8,5);g.fillStyle='#24252a';g.fillRect(rx+3,ry+34,9,6);g.fillRect(rx+24,ry+34,9,6);g.fillStyle='#f5c67a';g.font='18px monospace';g.fillText(d?.success?'¡META!':'robot siguiendo la ruta',20,30);if(n<p.length-1)n++;requestAnimationFrame(draw)}setInterval(load,1000);load();draw();</script>
<style>#boardWrap{position:relative}#robotMarker{position:absolute;width:30px;height:30px;background:#e6a83b;border:3px solid #241e28;border-radius:6px;z-index:5;box-shadow:0 0 0 3px #f5d477;pointer-events:none;transition:left .12s linear,top .12s linear}#robotMarker:after{content:'• •';position:absolute;left:3px;top:2px;color:#b9f5ef;font-weight:bold;letter-spacing:3px}</style><script>document.addEventListener('DOMContentLoaded',()=>{const c=document.querySelector('#c');const wrap=document.createElement('div');wrap.id='boardWrap';c.parentNode.insertBefore(wrap,c);wrap.appendChild(c);const m=document.createElement('div');m.id='robotMarker';wrap.appendChild(m);const info=document.createElement('b');info.id='stepInfo';info.style='display:block;color:#f2a65a;margin:6px 0';wrap.parentNode.insertBefore(info,wrap);let d2=null,k=0;async function get(){try{const n=await(await fetch('logs/qlearning_live.json?'+Date.now())).json();if(!d2||n.episode!==d2.episode)k=0;d2=n}catch(e){}}function move(){if(d2&&d2.path){const p=d2.path[Math.min(k,d2.path.length-1)],cell=c.clientWidth/900;m.style.left=(150+p[0]*48)*cell+ 'px';m.style.top=(55+p[1]*48)*cell+'px';info.textContent='paso '+Math.min(k+1,d2.path.length)+' / '+d2.path.length;k=Math.min(k+1,d2.path.length-1)}requestAnimationFrame(move)}setInterval(get,700);get();move()});</script>
