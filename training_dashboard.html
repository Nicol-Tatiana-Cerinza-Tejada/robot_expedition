<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q-learning en vivo</title>
<style>body{font:16px system-ui;background:#10151d;color:#edf2f7;max-width:850px;margin:35px auto;padding:0 18px}h1{color:#f2a65a}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#1b2430;border-radius:10px;padding:16px}.label{color:#9eafbf;font-size:13px}.value{font-size:27px;margin-top:5px}.bar{height:22px;background:#303b49;border-radius:5px;overflow:hidden;margin-top:7px}.fill{height:100%;background:#55c2a3;width:0%;transition:width .3s}.chart{height:180px;background:#0b1016;border-radius:8px;margin-top:18px;padding:10px}.note{color:#9eafbf}#status{color:#55c2a3;font-weight:bold}#robot2d{width:100%;height:190px;image-rendering:pixelated}</style><script>document.addEventListener('DOMContentLoaded',()=>{const d=document.createElement('div');d.className='chart';d.innerHTML='<canvas id="robot2d" width="820" height="190"></canvas>';document.body.appendChild(d);const q=document.querySelector('#robot2d').getContext('2d');let z=0;setInterval(()=>{z++;const w=820,p=parseFloat(document.querySelector('#progress').textContent)||0,x=35+Math.min(1,p/100)*(w-105),fall=document.querySelector('#state').textContent==='cae/repite',s=Math.sin(z*.3)*6;q.fillStyle='#101a2b';q.fillRect(0,0,w,190);q.fillStyle='#4a3038';q.fillRect(0,135,w,55);q.fillStyle='#61d68a';q.fillRect(w-45,60,5,75);q.save();q.translate(x,fall?125:92);if(fall)q.rotate(-.7);q.fillStyle='#ddd';q.fillRect(-17,-35,34,24);q.fillStyle='#2d91aa';q.fillRect(-12,-30,24,13);q.fillStyle='#ddd';q.fillRect(-15,-10,30,27);q.fillStyle='#e6aa38';q.fillRect(-11,17,8,25+s);q.fillRect(4,17,8,25-s);q.restore();q.fillStyle='#f2a65a';q.font='16px monospace';q.fillText(fall?'robot: se recupera':'robot: avanza',15,25)},120)});</script></head>
<body><h1>Entrenamiento Q-learning</h1><p class="note">Esta pantalla se actualiza después de cada episodio del agente real.</p><p id="status">Esperando entrenamiento…</p><div class="grid"><div class="card"><div class="label">Época</div><div class="value" id="episode">—</div></div><div class="card"><div class="label">Premio</div><div class="value" id="reward">—</div></div><div class="card"><div class="label">Estado</div><div class="value" id="state">—</div></div><div class="card"><div class="label">Progreso hacia la meta</div><div class="value" id="progress">—</div><div class="bar"><div class="fill" id="progressBar"></div></div></div><div class="card"><div class="label">Pasos</div><div class="value" id="steps">—</div></div><div class="card"><div class="label">Estados Q / exploración</div><div class="value"><span id="states">—</span> / <span id="epsilon">—</span></div></div></div><div class="chart"><canvas id="plot" width="820" height="160"></canvas></div><p class="note">Actualización automática cada 500 ms · META significa que alcanzó la misión.</p>
<script>const history=[];async function refresh(){try{const r=await fetch('logs/qlearning_live.json?'+Date.now());const d=await r.json();document.querySelector('#episode').textContent=d.episode+' / '+d.total_episodes;document.querySelector('#reward').textContent=Number(d.reward).toFixed(2);document.querySelector('#state').textContent=d.status;document.querySelector('#progress').textContent=(d.progress*100).toFixed(1)+'%';document.querySelector('#progressBar').style.width=Math.max(0,Math.min(100,d.progress*100))+'%';document.querySelector('#steps').textContent=d.steps;document.querySelector('#states').textContent=d.states;document.querySelector('#epsilon').textContent=Number(d.epsilon).toFixed(3);document.querySelector('#status').textContent=d.success?'¡Misión alcanzada!':'Entrenando…';history.push(d);draw()}catch(e){document.querySelector('#status').textContent='Esperando logs/qlearning_live.json…'}}function draw(){const c=document.querySelector('#plot'),x=c.getContext('2d'),w=c.width,h=c.height;x.clearRect(0,0,w,h);if(history.length<1)return;const max=Math.max(1,...history.map(a=>Math.abs(a.reward)));x.strokeStyle='#f2a65a';x.lineWidth=3;x.beginPath();history.forEach((a,i)=>{const px=i*w/Math.max(1,history.length-1),py=h/2-a.reward/max*h/2;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();x.fillStyle='#9eafbf';x.font='13px system-ui';x.fillText('premio por episodio',10,18)}setInterval(refresh,500);refresh();</script></body></html>
<script>const b=document.createElement('div');b.innerHTML='<canvas id="robot2d" width="820" height="190" style="width:100%;background:#101a2b;image-rendering:pixelated"></canvas>';document.body.appendChild(b);const q=document.querySelector('#robot2d').getContext('2d');let z=0;setInterval(()=>{z++;const w=820,h=190,p=parseFloat(document.querySelector('#progress').textContent)||0,x=35+Math.min(1,p/100)*(w-105),fall=document.querySelector('#state').textContent==='cae/repite',s=Math.sin(z*.3)*6;q.clearRect(0,0,w,h);q.fillStyle='#101a2b';q.fillRect(0,0,w,h);q.fillStyle='#4a3038';q.fillRect(0,135,w,55);q.fillStyle='#61d68a';q.fillRect(w-45,60,5,75);q.save();q.translate(x,fall?125:92);if(fall)q.rotate(-.7);q.fillStyle='#ddd';q.fillRect(-17,-35,34,24);q.fillStyle='#2d91aa';q.fillRect(-12,-30,24,13);q.fillStyle='#ddd';q.fillRect(-15,-10,30,27);q.fillStyle='#e6aa38';q.fillRect(-11,17,8,25+s);q.fillRect(4,17,8,25-s);q.restore();q.fillStyle='#f2a65a';q.font='16px monospace';q.fillText(fall?'robot: se recupera':'robot: avanza',15,25)},120)}</script>
